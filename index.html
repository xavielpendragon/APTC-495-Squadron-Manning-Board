<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Military Manning Board</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <link rel="stylesheet" href="style.css"/>
</head>
<body>

<header class="header">
  <div class="header-left">
    <div class="branch-badge" id="branch-badge">USAF</div>
    <div>
      <div class="header-title" id="header-title">Military Manning Board</div>
      <div class="header-sub">
        <div style="display:flex; align-items:center; gap:6px;">
    <input type="text" class="unit-name-input" id="unit-name" placeholder="Enter Unit Name..." onchange="saveState()" readonly />
    <button class="sec-ctrl-btn" id="unit-name-toggle" onclick="toggleUnitNameEdit()" title="Unlock Unit Name">
        <svg id="lock-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:12px;height:12px;">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
        </svg>
    </button>
</div>
      </div>
    </div>
  </div>
  <div class="header-center" id="branch-switcher"></div>
  <div class="header-actions">
    <button class="btn" onclick="document.getElementById('csv-input').click()" title="Import roster from CSV — columns: name,rank,role,status,quals,notes,dutyStart,arrived,deros">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17,8 12,3 7,8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
      <span>Import CSV</span>
    </button>
    <button class="btn" onclick="downloadCSVTemplate()" title="Download blank CSV template">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7,10 12,15 17,10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      <span>Template</span>
    </button>
    <input type="file" id="csv-input" accept=".csv,.tsv,.txt" style="display:none" onchange="importCSV(this)"/>
    <button class="btn" onclick="openAddModal()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" y1="8" x2="19" y2="14"/><line x1="16" y1="11" x2="22" y2="11"/></svg>
      <span>Add</span>
    </button>
    <button class="btn btn-whatif" id="whatif-btn" onclick="toggleWhatIf()" title="Toggle what-if mode">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/><circle cx="12" cy="12" r="10"/></svg>
      <span>What-If</span>
    </button>
    <button class="btn" onclick="toggleDerosPanel()" title="DEROS rotation panel">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
      <span>DEROS</span>
    </button>
    <button class="btn btn-danger" onclick="clearState()" title="Reset all rosters to defaults">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="1,4 1,10 7,10"/><path d="M3.51 15a9 9 0 1 0 .49-3.5"/></svg>
      <span>Reset</span>
    </button>
    <button class="btn btn-export" id="export-btn" onclick="exportPDF()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14,2 14,8 20,8"/><line x1="12" y1="18" x2="12" y2="12"/><polyline points="9,15 12,18 15,15"/></svg>
      <span>Export PDF</span>
    </button>
  </div>
</header>

<main class="main">
  <div class="whatif-banner" id="whatif-banner">
    <span style="font-family:var(--mono);font-size:9px;font-weight:600;background:var(--amber);color:#000;padding:2px 6px;border-radius:3px;letter-spacing:.06em">WHAT-IF</span>
    Click any person card to toggle them out of the simulation. Metrics update in real time. No data is changed.
    <button class="btn" style="margin-left:auto;padding:3px 10px;font-size:11px" onclick="clearWhatIf()">Clear all</button>
  </div>
  <div class="deros-panel" id="deros-panel">
    <div class="deros-panel-header">
      <div class="section-name">Upcoming DEROS / Rotations</div>
      <button class="btn" style="padding:3px 10px;font-size:11px" onclick="toggleDerosPanel()">Close</button>
    </div>
    <div class="deros-list" id="deros-list"></div>
  </div>
  <div class="alerts" id="alerts"></div>
  <div class="metrics" id="metrics"></div>
  <div class="toolbar">
    <div class="legend">
      <div class="legend-item"><div class="legend-dot" style="background:var(--green)"></div><span id="leg-available">Available</span></div>
      <div class="legend-item"><div class="legend-dot" style="background:var(--amber)"></div><span id="leg-tdy">TDY</span></div>
      <div class="legend-item"><div class="legend-dot" style="background:#38bdf8"></div><span id="leg-tdy">Medical</span></div>
      <div class="legend-item"><div class="legend-dot" style="background:#a855f7"></div><span id="leg-tdy">Leave</span></div>
      <div class="legend-item"><div class="legend-dot" style="background:var(--red)"></div><span id="leg-deployed">Deployed</span></div>
    </div>
    <div style="display:flex;align-items:center;gap:8px">
      <div class="search-wrap">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input class="search-input" id="search-input" placeholder="Search by name, rank, role…" oninput="onSearch(this.value)"/>
        <button class="search-clear" id="search-clear" onclick="clearSearch()">×</button>
      </div>
      <div class="timestamp" id="timestamp"></div>
    </div>
  </div>
  <div class="sections-grid" id="sections-grid"></div>
  <div style="margin-bottom:10px">
    <button class="add-section-btn" onclick="addSection()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      Add section
    </button>
  </div>
  <div class="pool-section">
    <div class="pool-header">
      <div>
        <div class="section-name" id="pool-title">Unassigned / Staging</div>
        <div class="pool-sub" id="pool-sub">Drag to a slot to assign · drag here to unassign</div>
      </div>
      <div style="display:flex;align-items:center;gap:8px">
        <select id="pool-sort" onchange="renderPool()" style="font-size:11px;font-family:var(--mono);background:var(--surface2);border:1px solid var(--border2);border-radius:var(--radius);color:var(--text2);padding:3px 7px;outline:none;cursor:pointer">
          <option value="name">Sort: Name</option>
          <option value="rank">Sort: Rank</option>
          <option value="status">Sort: Status</option>
          <option value="role">Sort: Role</option>
        </select>
        <span class="badge" id="pool-badge">0</span>
      </div>
    </div>
    <div class="pool-drop" id="pool-drop"></div>
  </div>
</main>

<!-- Modal -->
<div class="modal-overlay" id="modal-overlay">
  <div class="modal">
    <div class="modal-title" id="modal-title">Add personnel</div>
    <div class="form-group"><label class="form-label">Name</label><input class="form-input" id="f-name" type="text" placeholder="Last, First"/></div>
    <div class="form-group"><label class="form-label">Rank</label><select class="form-select" id="f-rank"></select></div>
    <div class="form-group"><label class="form-label" id="f-role-label">MOS / Role</label><input class="form-input" id="f-role" type="text" placeholder="e.g. 11B Infantryman"/></div>
    <div class="form-group"><label class="form-label">Status</label>
      <select id="f-status" class="form-select">
        <option value="available">Available</option>
        <option value="tdy">TDY</option>
        <option value="leave">Leave</option>
        <option value="medical">Medical</option>
        <option value="deployed">Deployed</option>
      </select>
    </div>
    <div class="form-group"><label class="form-label">Qualifications</label><div class="qual-grid" id="qual-grid"></div></div>
    <div class="form-group"><label class="form-label">Duty Start Date</label><input class="form-input" id="f-duty-start" type="date"/></div>
    <div class="form-group"><label class="form-label">Date Arrived at Station</label><input class="form-input" id="f-arrived" type="date"/></div>
    <div class="form-group"><label class="form-label">DEROS</label><input class="form-input" id="f-deros" type="date"/></div>
    <div class="form-group"><label class="form-label">Notes / Remarks</label><textarea class="form-input" id="f-notes" rows="2" placeholder="Pending PCS, medical profile, projected return…" style="resize:vertical;min-height:52px"></textarea></div>
    <div class="modal-actions">
      <div style="display:flex; gap:7px; margin-right:auto;">
        <button class="btn btn-danger" id="btn-delete" style="display:none;" onclick="deletePerson()">Delete</button>
        <button class="btn" id="btn-unassign" style="display:none;" onclick="unassignPerson()">Unassign</button>
      </div>
        <button class="btn" onclick="closeModal()">Cancel</button>
        <button class="btn btn-primary" onclick="savePerson()">Save</button>
    </div>
  </div>
</div>

<div class="toast" id="toast">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20,6 9,17 4,12"/></svg>
  <span id="toast-msg">Done</span>
</div>

    <script src="script.js" defer></script>
</body>
</html>
